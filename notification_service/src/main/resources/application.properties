# ===================================
# APPLICATION
# ===================================
spring.application.name=notification_service
server.port=8085

# ===================================
# BASE DE DONNÉES POSTGRESQL
# ===================================
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# RABBITMQ
# ===================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# ===================================
# EMAIL (SMTP)
# ===================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noebiyiha@gmail.com
spring.mail.password=kirf kvtm nbzm bkxy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

# ===================================
# THYMELEAF
# ===================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===================================
# PARAMÈTRES MÉTIER NOTIFICATION
# ===================================
notification.from-email=notifications@microfinancehub.cm
notification.from-name=MicroFinanceHub
notification.sms-from=+237XXXXXXXXX
notification.retry-max=3
notification.scheduler.echeance-rappel-cron=0 0 9 * * *
notification.scheduler.retard-detection-cron=0 0 0 * * *
notification.scheduler.cleanup-cron=0 0 2 * * SUN

# ===================================
# TWILIO (SMS)
# ===================================
twilio.account-sid=
twilio.auth-token=
twilio.enabled=false

# ===================================
# SWAGGER / OPENAPI
# ===================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# ===================================
# ACTUATOR
# ===================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized


# ===================================
# LOGGING
# ===================================
logging.level.com.microfinancehub=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.mail=DEBUG
# Active le binding des @ConfigurationProperties
spring.config.import=optional:

# Désactiver open-in-view (warning Hibernate)
spring.jpa.open-in-view=false

# Désactiver le check template Thymeleaf (pas encore de templates)
spring.thymeleaf.check-template-location=false

# Désactiver le health check mail (pas de SMTP configuré en dev)
management.health.mail.enabled=false





